<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M&M RPro Analytics — Dashboard</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header">
    <div class="header-left">
      <h1>M&M RPro Analytics</h1>
    </div>
    <div class="header-right">
      <span id="user-email"></span>
      <button id="logout-btn" class="btn-secondary">Log out</button>
    </div>
  </header>

  <main class="dashboard">
    <section class="summary-cards">
      <div class="card">
        <h3>Total Sales (Last 7 Days)</h3>
        <p class="metric" id="total-sales">—</p>
      </div>
      <div class="card">
        <h3>Units Sold</h3>
        <p class="metric" id="units-sold">—</p>
      </div>
      <div class="card">
        <h3>Stockout Risks</h3>
        <p class="metric" id="stockout-risks">—</p>
      </div>
      <div class="card">
        <h3>Excess Inventory</h3>
        <p class="metric" id="excess-inventory">—</p>
      </div>
    </section>

    <section class="chart-section">
      <div class="section-header">
        <h2>Store Sales</h2>
        <select id="period-select">
          <option value="7" selected>Last 7</option>
          <option value="30">Last 30</option>
        </select>
      </div>
      <div class="chart-placeholder" id="sales-chart">
        <p>Sales chart will appear here</p>
      </div>
    </section>

    <section class="recommendations">
      <div class="section-header">
        <h2>Recommendations</h2>
        <button id="review-items-btn" class="btn-primary">Review Items</button>
      </div>
      <table id="recommendations-table">
        <thead>
          <tr>
            <th>Item</th>
            <th>Store</th>
            <th>On Hand</th>
            <th>On Order</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colspan="5" class="empty">Loading recommendations…</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <!-- Ask AI Slide-over -->
  <button id="ask-ai-toggle" class="ask-ai-toggle">Ask AI</button>
  <div id="chat-panel" class="chat-panel hidden">
    <div class="chat-header">
      <h3>Ask AI</h3>
      <button id="close-chat" class="btn-icon">×</button>
    </div>
    <div id="chat-messages" class="chat-messages"></div>
    <form id="chat-form" class="chat-form">
      <input type="text" id="chat-input" placeholder="Ask a question about your data…" required>
      <button type="submit" class="btn-primary">Send</button>
    </form>
  </div>

  <script src="js/dashboard.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
